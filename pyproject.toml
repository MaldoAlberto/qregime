[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qregime"
version = "0.1.0"
description = "QEM, QEC or FTQC? A validated decision layer that tells you which error-handling regime a quantum circuit needs."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Alberto Maldonado", email = "alberto.maldo1312@gmail.com" }]
keywords = ["quantum computing", "error mitigation", "quantum error correction",
            "fault tolerance", "ZX-calculus", "resource estimation", "qiskit"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "qiskit>=1.0",
    "qiskit-aer>=0.14",
    "pyzx>=0.8",
    "networkx>=3.0",
    "numpy>=1.24",
    "scipy>=1.10",
    "rustworkx>=0.13",
]

[project.optional-dependencies]
qec = ["stim>=1.12", "pymatching>=2.0"]
deltakit = ["deltakit>=0.10"]  # examples/deltakit_crosscheck.py
notebook = ["jupyter", "matplotlib"]
dev = ["pytest>=7", "nbclient", "ipykernel", "matplotlib"]

[project.scripts]
qregime = "qregime.cli:main"

[project.urls]
Homepage = "https://github.com/MaldoAlberto/qregime"
Paper = "https://github.com/MaldoAlberto/qregime/blob/main/paper/paper_en.pdf"
Issues = "https://github.com/MaldoAlberto/qregime/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
qregime = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
